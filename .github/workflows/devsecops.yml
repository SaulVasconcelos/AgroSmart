# Pipeline DevSecOps do AgroSmart (Fase 7).
# Executa o MESMO script do pipeline local (02_plataforma/devsecops/pipeline.py):
# Ruff → Bandit → testes Python/JS → build da imagem → container ponta a ponta → Trivy.
# Actions fixadas por SHA de commit (conferidos com `git ls-remote` em 17/11/2026).
name: devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 02_plataforma
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Node.js 24 (somente para os testes JS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Executar pipeline DevSecOps
        run: python devsecops/pipeline.py --modo ci

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-devsecops-${{ github.run_id }}
          path: 02_plataforma/relatorios/
          if-no-files-found: error
          retention-days: 30
